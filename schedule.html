<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 일정표</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c1f24;--sub:#6b7280;--line:#e5e7eb;--acc:#2563eb;--accbg:#dbe6fd;--sun:#e11d48;--pri:#111827;--onpri:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d23;--text:#eef0f3;--sub:#9aa1ad;--line:#2a2e36;--acc:#60a5fa;--accbg:#1e2b44;--sun:#fb7185;--pri:#eef0f3;--onpri:#111827}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d23;--text:#eef0f3;--sub:#9aa1ad;--line:#2a2e36;--acc:#60a5fa;--accbg:#1e2b44;--sun:#fb7185;--pri:#eef0f3;--onpri:#111827}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
.menu{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line)}
.menu ul{list-style:none;max-width:560px;margin:0 auto;padding:10px 16px;display:flex;gap:6px}
.menu a{display:block;padding:6px 14px;border-radius:999px;color:var(--text);text-decoration:none;font-size:15px}
.menu a:hover{background:var(--line)}
.menu a[aria-current]{background:var(--card);border:1px solid var(--line);font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{background:none;border:0;color:var(--text);font-size:22px;padding:8px 14px;cursor:pointer}
.nav h1{font-size:18px;margin:0}
.today{display:block;margin:0 auto 12px;background:none;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:4px 14px;font-size:13px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{text-align:center;font-size:12px;color:var(--sub);padding:4px 0 6px}
.wd:first-child,.c.sun .n{color:var(--sun)}
.c{min-height:52px;border:0;background:none;color:var(--text);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font:inherit}
.c.out{visibility:hidden}
.c .n{font-size:14px;width:26px;height:26px;line-height:26px;border-radius:13px;text-align:center}
.c.is-today .n{background:var(--pri);color:var(--onpri)}
.c.sel{background:var(--accbg)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--acc)}
h2{font-size:14px;margin:4px 4px 10px;color:var(--sub);font-weight:600}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px}
.item .t{font-size:13px;color:var(--acc);font-weight:600;min-width:44px}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.item .m span{font-size:12px;color:var(--sub);overflow-wrap:anywhere}
.item .x{background:none;border:0;color:var(--sub);font-size:18px;padding:4px 6px;cursor:pointer}
.empty{text-align:center;color:var(--sub);padding:20px 0;font-size:14px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;border:0;background:var(--pri);color:var(--onpri);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet input{width:100%;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
.sheet .row{display:flex;gap:8px}
.sheet .go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font-size:16px;font-weight:700;cursor:pointer}
.cancel{width:100%;background:none;border:0;color:var(--sub);padding:10px;margin-top:4px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<nav class="menu" aria-label="메뉴"><ul><li><a href="index.html">소개</a></li><li><a href="schedule.html" aria-current="page">일정표</a></li><li><a href="budget.html">가계부</a></li></ul></nav>
<div class="wrap">
  <div class="nav"><button id="prev" aria-label="이전 달">‹</button><h1 id="ttl"></h1><button id="next" aria-label="다음 달">›</button></div>
  <button class="today" id="tdy">오늘</button>
  <div class="card"><div class="grid" id="grid"></div></div>
  <h2 id="dayttl"></h2>
  <div id="list"></div>
</div>
<button class="fab" id="fab" aria-label="일정 추가">+</button>
<div class="ov" id="ov">
  <div class="sheet">
    <input type="text" id="title" placeholder="일정 (예: 병원 예약)">
    <div class="row"><input type="date" id="date"><input type="time" id="time" aria-label="시간 (선택)"></div>
    <input type="text" id="memo" placeholder="메모 (선택)">
    <button class="go" id="save">저장</button>
    <button class="cancel" id="cx">취소</button>
  </div>
</div>
<script>
var KEY="schedule_items_v1",items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function $(i){return document.getElementById(i)}
function pad(n){return String(n).padStart(2,"0")}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var now=new Date(),view=new Date(now.getFullYear(),now.getMonth(),1),sel=fmt(now);
function byDate(ds){return items.filter(function(x){return x.date===ds}).sort(function(a,b){return (a.time||"99").localeCompare(b.time||"99")||a.id-b.id})}
function render(){
  var y=view.getFullYear(),m=view.getMonth(),t=fmt(new Date());
  $("ttl").textContent=y+"년 "+(m+1)+"월";
  var h="일월화수목금토".split("").map(function(w){return '<div class="wd">'+w+'</div>'}).join("");
  var first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  for(var i=0;i<first;i++)h+='<div class="c out"></div>';
  for(var d=1;d<=days;d++){
    var ds=y+"-"+pad(m+1)+"-"+pad(d),n=byDate(ds).length,wd=(first+d-1)%7;
    var cls="c"+(wd===0?" sun":"")+(ds===t?" is-today":"")+(ds===sel?" sel":"");
    var dots="";for(var k=0;k<Math.min(n,3);k++)dots+="<i></i>";
    h+='<button class="'+cls+'" data-d="'+ds+'" aria-label="'+(m+1)+'월 '+d+'일'+(n?', 일정 '+n+'개':'')+'"><span class="n">'+d+'</span><span class="dots">'+dots+'</span></button>';
  }
  $("grid").innerHTML=h;
  var sd=new Date(sel+"T00:00:00");
  $("dayttl").textContent=(sd.getMonth()+1)+"월 "+sd.getDate()+"일 ("+"일월화수목금토"[sd.getDay()]+") 일정";
  var list=byDate(sel);
  $("list").innerHTML=list.map(function(x){return '<div class="item"><div class="t">'+(x.time?esc(x.time):"종일")+'</div><div class="m"><b>'+esc(x.title)+'</b>'+(x.memo?'<span>'+esc(x.memo)+'</span>':'')+'</div><button class="x" data-id="'+x.id+'" aria-label="삭제">✕</button></div>'}).join("")||'<div class="empty">이 날은 일정이 없어요.<br>아래 + 버튼으로 추가해보세요.</div>';
}
function shift(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}
$("prev").onclick=function(){shift(-1)};$("next").onclick=function(){shift(1)};
$("tdy").onclick=function(){var t=new Date();view=new Date(t.getFullYear(),t.getMonth(),1);sel=fmt(t);render()};
$("grid").onclick=function(e){var b=e.target.closest&&e.target.closest("[data-d]");if(b){sel=b.getAttribute("data-d");render()}};
$("fab").onclick=function(){$("title").value="";$("time").value="";$("memo").value="";$("date").value=sel;$("ov").classList.add("on");$("title").focus()};
function close(){$("ov").classList.remove("on")}
$("cx").onclick=close;$("ov").onclick=function(e){if(e.target===$("ov"))close()};
$("save").onclick=function(){
  var ti=$("title").value.trim();if(!ti){$("title").focus();return}
  var ds=$("date").value||sel;
  items.push({id:Date.now(),date:ds,time:$("time").value,title:ti,memo:$("memo").value.trim()});
  persist();sel=ds;var p=ds.split("-");view=new Date(+p[0],+p[1]-1,1);close();render();
};
$("list").onclick=function(e){
  var id=e.target.getAttribute&&e.target.getAttribute("data-id");
  if(id&&confirm("이 일정을 삭제할까요?")){items=items.filter(function(x){return String(x.id)!==id});persist();render()}
};
render();
</script>
</body>
</html>
